<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;background:#111016;color:#f5f1f8;font:16px/1.7 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:35px 18px 70px}h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1.15}.muted{color:#bcb4c8}.q{display:none;background:#1d1a25;border:1px solid #41384b;border-radius:16px;padding:22px;margin:18px 0}.q.active{display:block}.motif{color:#d8a8f4;font-size:.85rem}.opt{display:block;padding:12px;border:1px solid #41384b;border-radius:10px;margin:9px 0;cursor:pointer}.opt:has(input:checked){border-color:#d8a8f4;background:#30243a}.opt input{accent-color:#d8a8f4;margin-right:8px}button{padding:13px 18px;border:0;border-radius:10px;font-weight:bold;cursor:pointer;margin:8px 8px 8px 0}.go{background:#d8a8f4;color:#201428}.reset{background:#34303b;color:white}.bar{height:5px;background:#37313e;margin:22px 0}.bar span{display:block;height:100%;width:0;background:#d8a8f4}.result{display:none;background:#241d2d;border:1px solid #8d6aa0;padding:22px;border-radius:16px;margin-top:24px}.type{padding:12px 0;border-bottom:1px solid #44394d}.type:last-child{border:0}.type h2{margin:.15rem 0;color:#d8a8f4}.type p{margin:.5rem 0}small{color:#bcb4c8}

.hero{position:relative;overflow:hidden;padding:clamp(24px,5vw,48px);border:1px solid #6b343b;border-radius:18px;background:linear-gradient(90deg,rgba(10,9,12,.96),rgba(10,9,12,.72)),url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1600&q=85") center/cover;margin:22px 0 28px}

</style></head><body><main>
<section class="hero" id="welcome">
<div class="motif">HORROR SURVIVAL TEST · 7 QUESTIONS</div>
<h1>호러 영화 속에서<br>나는 어떤 캐릭터일까?</h1>
<p>문 밖의 수상한 소리, 기이한 사람들, 어둠 속 발자국...</p>
<p>호러 영화 속에서 우리는 어떤 선택을 하게 될까요? 어쩌면 내가 호러에 대처하는 방식은, 나의 삶의 방식과도 맞닿아 있을지 모릅니다.</p>
<button class="go" type="button" id="start">시작하기 →</button>
</section>
<section id="test-area" style="display:none">
<div class="bar"><span id="progress"></span></div>
<form id="quiz"></form>
<div class="actions">
<button class="reset" type="button" id="prev" style="display:none">← 이전 질문</button>
<button class="go" type="button" id="next">다음 질문 →</button>
<button class="go" type="button" id="submit" style="display:none">결과 확인하기 →</button>
<button class="reset" type="button" id="reset">처음부터</button>
</div>
<p class="muted" id="notice">가장 나다운 선택지 하나를 골라주세요.</p>
</section>
<section class="result" id="result"></section>
</main>
<script>
const qs=[
["한밤중의 방문자","모티프: 《나는 전설이다》","좀비 사태가 발생하고 몇 년이 지났다. 당신은 도시 외곽의 숙소에서 혼자 버티고 있다. 아무도 마주치지 못했고 무전기에서도 대답이 없다. 식량은 사흘 치뿐. 새벽 2시, 현관문 밖에서 똑똑, 누군가 정중하게 문을 두드린다.",[
["fighter","무기를 챙기고 문이 열릴 때를 대비한다. 먼저 공격당할 이유는 없다."],["truth","문밖의 발소리와 반응을 살핀다. 사람인지, 좀비인지, 다른 무언가인지부터 알아내야 한다."],["monster","문 밖으로 조심스럽게 말을 걸어본다. 무작정 적이라고 단정하고 싶지 않다."],["survivor","뒷문으로 빠져나갈 준비를 한다. 정체를 모르는 상대와 맞설 이유는 없다. 일단 도망친다."]]],
["금지된 지하실","모티프: 《캐빈 인 더 우즈》","친구들과 산속의 오래된 저택으로 여름휴가를 왔다. 주인은 “지하실 문은 절대로 열지 말아주세요. 열면 저주받으니까요”라고 당부한다. 그날 밤, 술에 취한 친구들은 지하실을 열지 말지로 다툰다.",[
["survivor","지하실 문은 열지 말자고 말린다. 친구들이 연다고 하면 혼자라도 집으로 돌아갈 것이다."],["truth","집주인이 왜 그런 말을 했는지 알아본다. 저택에 관한 기록이나 다른 단서가 있을지도 모른다."],["fighter","오히려 궁금해진다. 대체 뭐가 있길래 저렇게까지 말리는 걸까? 직접 열어 안을 확인하고 싶다."],["guardian","친구들이 술김에 무슨 짓을 할지 모르니 곁을 지킨다. 친구들이 내려간다면 어쩔 수 없이 따라간다."]]],
["누가 인간인가","모티프: 《괴물》(The Thing, 1982)","긴급 구조 요청을 받고 남극의 연구 기지에 도착했다. 난장판이 된 기지에는 사람이라곤 보이지 않는다. CCTV에는 기지를 배회하는 끔찍한 괴물이 찍혀 있다. 괴물은 매우 사납고 흉포하다. 동료들은 괴물을 처치하거나, 그냥 도망가자고 주장한다. 의견이 맞지 않는 동료들은 서로 언성을 높이기 시작한다. 싸움이 길어지면 무리가 분리될지도 모른다. 그런데…… 괴물이 연구 기지의 작업복을 입고 있는 것 같다.",[
["fighter","괴물이 더 많은 사람을 해치기 전에 직접 맞선다. 위험하더라도 누군가는 저 괴물을 막아야 한다."],["truth","아직 괴물을 죽여서는 안 된다. CCTV 기록과 연구 자료를 분석해 무엇으로부터 탄생했고 어떻게 만들어졌는지 알아낸다."],["guardian","동료들의 싸움을 말리고 의견부터 조율한다. 이런 상황에서 무리가 갈라지는 것은 무엇보다 피해야 한다."],["monster","괴물의 행동을 가까이서 살펴보기 위해 몰래 다가간다. 인간이 저렇게 된 것이라면, 의사소통할 방법이 있을지도 모른다."]]],
["마지막 게임","모티프: 《쏘우》","낯선 지하실에서 눈을 뜬 당신. 손목에는 쇠사슬이 채워져 있고, 낯선 사람과 함께 갇혀 있다. 스피커에서는 제한 시간 안에 탈출하지 못하면 둘 다 죽는다는 목소리가 들린다. 장치는 누군가 위험을 감수해야 작동하는 듯하다. 함께 갇힌 사람은 심한 패닉 상태에 빠져, 유용한 대화를 나누는 것이 사실상 불가능하다.",[
["fighter","놈이 만든 게임에 순순히 따를 생각은 없다. 장치를 부수든 벽을 뜯든 탈출할 방법을 직접 만들어낸다."],["truth","방금 스피커를 통해 흘러나온 목소리. 말투가 어딘가 익숙하다. 나에게 이런 짓을 할 사람이 누구일까? 기억을 더듬으며 목소리의 주인과 내가 이곳에 오게 된 이유를 추리해 본다."],["guardian","패닉 상태에 빠진 상대를 몰아붙일 수 없다. 내가 위험을 감수해서라도 장치를 작동시킬지 고민한다."],["survivor","감정적으로 판단할 시간은 없다. 어떻게든 상대가 장치를 작동시키도록 유도한다."]]],
["한여름의 축제","모티프: 《미드소마》","친구들과 외딴 산골 마을의 축제에 초대받는다. 마을 사람들은 친절하지만, 축제에는 기이한 의식과 설명할 수 없는 규칙이 있다. 친구 한 명이 갑자기 사라지고 마을 사람들은 아무 일 없다는 듯 다음 의식을 준비한다.",[
["truth","축제의 기록과 마을 관습을 조사한다. 의식의 의미를 알아야 친구가 사라진 이유도 밝힐 수 있다."],["guardian","위험을 감수해서라도 사라진 친구를 찾아본다. 단 한 명도 이곳에 두고 갈 수 없다."],["survivor","마을 사람들을 자극하지 않도록 축제에 협조하는 척한다. 경계를 늦추지 않고 탈출 기회를 찾는다."],["monster","마을 사람 중 한 명에게 조용히 속내를 물어본다. 왜 이런 의식을 치르는지 이해하면 적대하지 않고 빠져나갈 방법도 있을지 모른다."]]],
["어둠 속의 추격자","모티프: 《디센트》","어둠 속에서 괴물이 당신과 동료들을 쫓아온다. 소리를 낼 때마다 괴물은 찢어지는 비명을 내며 우리를 쫓아온다. 정신없이 도망치다 보니 모두 흩어지고, 당신은 큰 부상을 입은 동료와 함께 가까스로 추격을 따돌린다. 당장은 괴물의 시야에서 벗어났지만, 괴물의 울음소리는 여전히 들려온다.",[
["fighter","계속 도망치기만 해서는 끝이 없다. 소리를 내 괴물을 유인하고, 직접 맞서 추격을 끊어낸다."],["guardian","동료를 위험에 빠뜨리는 짓은 할 수 없다. 우선 동료의 상태를 살피고, 응급처치를 하며 안정을 되찾도록 돕는다."],["survivor","지금은 괴물과 맞서거나 무작정 움직일 때가 아니다. 동료를 안전한 곳에 숨겨 두고, 괴물이 멀어진 틈에 출구를 찾는다."],["monster","괴물의 반응을 자세히 살펴본다. 어쩌면 괴물은 소리를 공격으로 간주할 뿐, 인간에게 적대적이지는 않을지도 모른다."]]],
["누가 악마인가?","모티프: 《데블》(Devil, 2010)","낯선 사람들과 고층 빌딩의 엘리베이터에 갇힌다. 불이 꺼졌다 켜지자 한 사람이 피를 흘리며 쓰러져 있다. 다시 불이 꺼지고 비명이 울린다. 구조대가 밖에서 애쓰는 동안 사람들은 서로를 의심한다. 범인이 우리 중에 있다는 사람도, 인간이 아닌 존재가 있다는 사람도 있다.",[
["fighter","다음에 불이 꺼지면 가만히 당하고만 있지 않을 것이다. 범인이 누구든 직접 맞서 이 살육을 끝낸다."],["truth","사건의 순서와 각자의 행동을 되짚어본다. 불이 꺼지는 순간마다 무슨 일이 있었는지 분석해 범인을 특정한다."],["survivor","범인을 밝히는 것보다 살아서 나가는 게 우선이다. 다른 사람들과 거리를 두고 스스로를 지킬 방법을 찾는다."],["monster","유독 이상한 행동을 보이는 사람에게 조심스럽게 말을 건다. 인간이 아닌 존재라면 왜 이런 일을 벌이는지 알아보고 싶다."]]]
];
const types={
 fighter:{name:"공포에 맞서는 자",en:"THE FIGHTER",desc:"당신은 공포 앞에서 상황이 저절로 나아지길 기다리지 않고 직접 움직이는 사람입니다. 위험을 감수하더라도 누군가는 괴물을 막고 판을 뒤집어야 한다고 생각합니다. 무모해서라기보다, 통제권을 빼앗긴 채 끌려다니는 걸 견디기 어려워 합니다. 직면하고, 부수는 것만이 공포에서 벗어날 수 있는 유일한 방법입니다.",quote:"“내가 끝낼게. 여기서 더는 아무도 죽게 두지 않아.”",character:"엘렌 리플리 — 《에이리언》 시리즈"},
 truth:{name:"공포를 해부하는 자",en:"THE TRUTH SEEKER",desc:"당신은 이해할 수 없는 일이 벌어지면 공포에 휩쓸리기보다 먼저 단서를 모으는 편입니다. 괴물의 정체와 사건의 규칙을 알아내야 무엇을 믿고 어떻게 행동할지 결정할 수 있는 법이니까요. 당신은 조사와 분석을 통해 공포의 정체를 파악하고, 그에 따른 대처 방법을 고민합니다. 당신은 공포가 무지로부터 온다고 믿습니다.",quote:"“잠깐. 우리가 모르는 규칙이 있어. 먼저 그걸 알아내야 해.”",character:"엘리 — 《쥬라기 공원》의 과학자적 탐구 태도 / 탐정형 주인공"},
 guardian:{name:"곁을 지키는 자",en:"THE GUARDIAN",desc:"당신은 위기에서 살아남는 일만큼이나 누구와 함께 살아남는지를 중요하게 여깁니다. 주변 사람이 위험에 처하면 혼자 도망치는 대신 곁을 지키고, 흩어진 사람들을 모아 함께 움직일 방법을 찾으려 합니다. 누군가를 지킨다는 건 부담인 동시에 쉽게 포기할 수 없는 책임입니다. 어쩌면, 당신은 갈림길 앞에서 소중한 사람들을 위해 스스로를 희생할지도 모릅니다.",quote:"“혼자 두고 가지 않아. 같이 나갈 방법을 찾자.”",character:"샘와이즈 갬지 — 《반지의 제왕》"},
 survivor:{name:"끝까지 살아남는 자",en:"THE FINAL GIRL",desc:"당신은 공포 속에서도 가장 먼저 현실적인 조건을 따져 봅니다. 맞서 싸우거나 진실을 밝히는 일이 멋있어 보여도, 살아남지 못하면 아무 의미가 없다고 생각합니다. 불필요한 위험은 피하고 기회를 기다리며, 감정보다 생존 확률을 우선하는 냉정한 판단이 강점입니다. 감정적으로 흔들리지 않고, 때로는 포기와 체념을 선택하기도 하죠. '파이널 걸'이 될 준비가 되었나요?",quote:"“영웅이 될 필요는 없어. 여기서 살아서 나가면 돼.”",character:"시드니 프레스콧 — 《스크림》"},
 monster:{name:"괴물과 친구가 되는 자",en:"THE MONSTER WHISPERER",desc:"당신은 낯설고 기괴한 존재를 마주해도 곧장 적이라고 단정하지 않습니다. 공포를 기꺼이 나의 일부로 받아들이고, 손을 내밀며 친구가 됩니다. 위험하다는 사실을 알면서도 그 존재가 무엇을 원하고 왜 그런 행동을 하는지 알고 싶어 합니다. 모두가 공격하거나 도망칠 때, 당신은 이해와 소통의 가능성을 살피며 다른 사람들이 보지 못한 출구를 찾을 수도 있습니다. 물론 위험은 기꺼이 감수해야겠죠!",quote:"“네가 정말 우리를 해치려는 게 아니라면, 우린 함께할 수 있어.”",character:"헬보이 — 《헬보이》 / 비인간 존재와 교감하는 이야기의 주인공"}
}
const form=document.getElementById("quiz");
let current=0;
qs.forEach((q,i)=>{let s=document.createElement("section");s.className="q"+(i===0?" active":"");s.dataset.index=i;s.innerHTML=`<div class="motif">QUESTION 0${i+1} / 07 · ${q[1]}</div><h2>${q[0]}</h2><p>${q[2]}</p>`+q[3].map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${o[0]}"><b>${"ABCD"[j]}.</b> ${o[1]}</label>`).join("");form.appendChild(s)});
const showQuestion=(i)=>{current=Math.max(0,Math.min(6,i));document.querySelectorAll(".q").forEach((el,j)=>el.classList.toggle("active",j===current));document.querySelector("#prev").style.display=current===0?"none":"inline-block";document.querySelector("#next").style.display=current===6?"none":"inline-block";document.querySelector("#submit").style.display=current===6?"inline-block":"none";document.querySelector("#notice").textContent=`가장 나다운 선택지 하나를 골라주세요.`;document.querySelector("#progress").style.width=(current/7*100)+"%";window.scrollTo({top:0,behavior:"smooth"});};
const update=()=>{const picked=form.querySelector(`input[name="q${current}"]:checked`);document.querySelector("#next").disabled=!picked;document.querySelector("#submit").disabled=!picked;document.querySelector("#progress").style.width=((current+(picked?1:0))/7*100)+"%";};
document.querySelector("#start").addEventListener("click",()=>{document.querySelector("#welcome").style.display="none";document.querySelector("#test-area").style.display="block";showQuestion(0);update();});
document.querySelector("#next").addEventListener("click",()=>{if(!form.querySelector(`input[name="q${current}"]:checked`))return;showQuestion(current+1);update();});
document.querySelector("#prev").addEventListener("click",()=>{showQuestion(current-1);update();});
form.addEventListener("change",update);
document.querySelector("#submit").addEventListener("click",()=>{let a=qs.map((_,i)=>form.querySelector(`input[name=q${i}]:checked`)?.value);let answered=a.filter(Boolean);if(answered.length!==7){document.querySelector("#notice").textContent="7개 질문에 모두 답해 줘!";return}let c={fighter:0,truth:0,guardian:0,survivor:0,monster:0};answered.forEach(x=>c[x]++);let sorted=Object.entries(c).sort((x,y)=>y[1]-x[1]);let first=sorted[0],second=sorted.find(x=>x[0]!==first[0]);let total=answered.length;let p1=Math.round(first[1]/total*100),p2=Math.round(second[1]/total*100);let primary=types[first[0]],secondary=types[second[0]];document.querySelector("#result").innerHTML=`<div class="primary-result"><div class="motif">YOUR STRONGEST TYPE</div><h2 class="main-name">${primary.name}</h2><div class="muted">${primary.en}</div><div class="main-percent">${p1}%</div><p>${primary.desc}</p><div class="quote">“${primary.quote.replace(/[“”]/g,"")}”</div><div class="character"><div><small>유형 모티브</small><br><b>${primary.character}</b><p class="muted">이 유형의 분위기를 떠올릴 수 있는 캐릭터</p></div></div></div><div class="secondary-result"><div><div class="motif">YOUR SECOND TYPE</div><h2>${secondary.name}</h2><div class="muted">${secondary.en}</div><p>${secondary.desc}</p></div><div class="secondary-percent">${p2}%</div></div><h3 style="margin-top:28px">다른 유형들은 이런 모습이에요</h3><div class="type-gallery">${Object.entries(types).map(([k,t])=>`<div class="type-card"><div class="info"><h3>${t.name}</h3><p>${t.quote}</p></div></div>`).join("")}</div><div class="actions"><button class="go" type="button" id="again-result">다시 테스트하기</button><button class="reset" onclick="window.print()">결과 저장 / 인쇄</button></div>`;document.querySelector("#test-area").style.display="none";document.querySelector("#result").style.display="block";document.querySelector("#again-result").addEventListener("click",()=>{form.reset();document.querySelector("#result").style.display="none";document.querySelector("#test-area").style.display="none";document.querySelector("#welcome").style.display="block";showQuestion(0);update();window.scrollTo({top:0,behavior:"smooth"});});document.querySelector("#result").scrollIntoView({behavior:"smooth"});});
document.querySelector("#reset").addEventListener("click",()=>{form.reset();document.querySelector("#result").style.display="none";document.querySelector("#test-area").style.display="none";document.querySelector("#welcome").style.display="block";showQuestion(0);update();window.scrollTo({top:0,behavior:"smooth"})});
</script></body></html>
